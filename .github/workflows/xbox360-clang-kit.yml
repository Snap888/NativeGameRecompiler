name: Xbox 360 Android Clang and LLD kit

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "toolchains/xbox360/build_clang_kit_android.sh"
      - ".github/workflows/xbox360-clang-kit.yml"

permissions:
  contents: read

jobs:
  build-clang-kit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl python3 ninja-build

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install pinned Android NDK and CMake
        run: sdkmanager "ndk;27.3.13750724" "cmake;3.22.1"

      - name: Build Android-hosted Clang, LLD and sysroot kit
        shell: bash
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.3.13750724"
          export CMAKE="$ANDROID_HOME/cmake/3.22.1/bin/cmake"
          export NINJA="$(command -v ninja)"
          bash toolchains/xbox360/build_clang_kit_android.sh

      - name: Upload Clang, LLD and kit
        uses: actions/upload-artifact@v4
        with:
          name: NGR-Xbox360-Clang-LLD-Android-arm64
          path: toolchains/xbox360/clang-out/*
          if-no-files-found: error
          retention-days: 14
