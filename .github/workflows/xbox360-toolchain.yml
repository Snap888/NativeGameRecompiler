name: Xbox 360 XenonRecomp ARM64

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "toolchains/xbox360/build_xenonrecomp_android.sh"
      - ".github/workflows/xbox360-toolchain.yml"

permissions:
  contents: read

jobs:
  build-xenonrecomp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl python3 ninja-build

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install pinned Android NDK and CMake
        run: sdkmanager "ndk;27.3.13750724" "cmake;3.22.1"

      - name: Build pinned XenonRecomp for Android arm64
        shell: bash
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.3.13750724"
          export CMAKE="$ANDROID_HOME/cmake/3.22.1/bin/cmake"
          export NINJA="$(command -v ninja)"
          bash toolchains/xbox360/build_xenonrecomp_android.sh

      - name: Upload compiler and corresponding source
        uses: actions/upload-artifact@v4
        with:
          name: NGR-Xbox360-XenonRecomp-arm64
          path: toolchains/xbox360/out/*
          if-no-files-found: error
          retention-days: 14
