name: NGR Android Build

on:
  push:
    branches:
      - integration/winnative-runtime-base
  workflow_dispatch:
  workflow_run:
    workflows: ["NGR XDroid360 Toolchain"]
    types: [completed]
    branches: [integration/winnative-runtime-base]

permissions:
  contents: read
  actions: read

concurrency:
  group: ngr-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-arm64:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integrated NGR + WinNative source
        uses: actions/checkout@v4
        with:
          ref: integration/winnative-runtime-base
          lfs: true
          submodules: recursive
          fetch-depth: 0

      - name: Verify pinned nx2android Switch engine source
        run: |
          set -euo pipefail
          test "$(git -C native/recompilers/nx2android rev-parse HEAD)" = "d6980c39410189dc426f007822bc53f96a624171"
          test -f native/recompilers/nx2android/nxnative/LICENSE
          test -f native/recompilers/nx2android/porter/__main__.py
          test -d native/recompilers/nx2android/nxnative/dm/android

      - name: Download the latest successful XDroid360 compiler and runtime payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/xdroid360/payload
          RUN_ID=$(gh run list --workflow ngr-xdroid360-toolchain.yml --branch integration/winnative-runtime-base --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$RUN_ID" ]; then
            echo "Using XDroid360 toolchain workflow run $RUN_ID"
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name ngr-xdroid360-payload --dir build/xdroid360/payload
            test -s build/xdroid360/payload/kit.zip
          else
            echo "No successful XDroid360 payload found; this APK will contain the integrated runtime UI without on-device compiler assets."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build dependencies
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.3.13750724" "cmake;3.22.1"

      - name: Install Rust Android target
        run: |
          rustup target add aarch64-linux-android
          rustc --version
          cargo --version

      - name: Verify pinned N64Recomp source
        run: |
          test -f native/recompilers/N64Recomp/include/recompiler/context.h
          test -f native/recompilers/N64Recomp/CMakeLists.txt
          git -C native/recompilers/N64Recomp rev-parse HEAD
          git lfs pull
          test -f native/recompilers/XDroid360/android/runtime/CMakeLists.txt
          test -f native/recompilers/XDroid360/android/app/src/main/java/com/udarmolota/xdroid360/BuildService.java
          test -d native/recompilers/XDroid360/recomp
          test "$(git -C native/recompilers/XDroid360 rev-parse HEAD)" = "6eefb7f738d4e63cb11cb6bb63911f55094e8ada"
          git -C native/recompilers/XDroid360 submodule status --recursive

      - name: Build N64Recomp and RSPRecomp host tools
        run: |
          cmake -S native/recompilers/N64Recomp -B /tmp/n64recomp-build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/n64recomp-build --target N64RecompCLI RSPRecomp --parallel 2
          test -x /tmp/n64recomp-build/N64Recomp
          test -x /tmp/n64recomp-build/RSPRecomp

      - name: Run NGR native ABI conformance tests
        run: |
          c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -I native/ngr-runtime/include native/ngr-runtime/src/backend_abi_validation.cpp native/ngr-runtime/tests/backend_abi_validation_test.cpp -o /tmp/ngr-abi
          /tmp/ngr-abi
          c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -pthread -I native/ngr-runtime/include native/ngr-runtime/src/backend_abi_validation.cpp native/ngr-runtime/src/backend_registry.cpp native/ngr-runtime/tests/backend_registry_test.cpp -o /tmp/ngr-registry
          /tmp/ngr-registry

      - name: Verify N64Recomp generation JNI wiring
        run: |
          grep -q "Java_com_ngr_app_N64RecompilerActivity_nativeGenerateN64C" native/ngr-runtime/src/n64recomp_bridge.cpp
          grep -q "nativeGenerateN64C" app/src/main/java/com/ngr/app/N64RecompilerActivity.kt
          grep -q "fixed point" native/ngr-runtime/src/n64recomp_bridge.cpp

      - name: Stage official SDL3 Android ARM64 runtime library
        shell: bash
        run: |
          set -euo pipefail
          SDL_AAR="vendor/maven/org/libsdl/android/SDL3/3.4.16/SDL3-3.4.16.aar"
          SDL_SHA256="03710fc7b49cc070551446841a843840fabf2aaaaa3043cd5739292a55e4e61c"
          test -s "$SDL_AAR"
          echo "$SDL_SHA256  $SDL_AAR" | sha256sum --check -
          unzip -Z1 "$SDL_AAR" > /tmp/sdl3-aar-entries.txt
          ENTRY=$(grep -E '(^|/)(arm64-v8a|android[.]arm64-v8a)/libSDL3[.]so$' /tmp/sdl3-aar-entries.txt | head -n 1 || true)
          if [ -z "$ENTRY" ]; then
            echo "Vendored official SDL3 3.4.16 AAR has no ARM64 libSDL3.so"
            grep -i 'libSDL3.*[.]so' /tmp/sdl3-aar-entries.txt || true
            exit 1
          fi
          mkdir -p app/src/main/jniLibs/arm64-v8a
          unzip -p "$SDL_AAR" "$ENTRY" > app/src/main/jniLibs/arm64-v8a/libSDL3.so
          test -s app/src/main/jniLibs/arm64-v8a/libSDL3.so
          file app/src/main/jniLibs/arm64-v8a/libSDL3.so
          echo "Staged verified official SDL3 3.4.16 ARM64 runtime from $ENTRY"
          
      - name: Run NGR JVM tests
        run: ./gradlew --no-daemon -Pxdroid360.toolchain=build/xdroid360/payload :app:testStandardDebugUnitTest

      - name: Build Android ARM64 APK
        run: ./gradlew --no-daemon -Pxdroid360.toolchain=build/xdroid360/payload assembleStandardDebug

      - name: Verify recompiler picker is registered and packaged
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)
          test -n "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -F 'com.ngr.app.NgrRecompilerPickerActivity'
          DEX_FOUND=0
          while IFS= read -r dex; do
            if unzip -p "$APK" "$dex" | strings | grep -Fq 'Lcom/ngr/app/NgrRecompilerPickerActivity;'; then DEX_FOUND=1; break; fi
          done < <(unzip -Z1 "$APK" | grep -E '^classes([0-9]+)?[.]dex')
          test "$DEX_FOUND" -eq 1 || { echo 'Picker Activity class is missing from APK DEX'; exit 1; }
          echo "Verified picker Activity in manifest and DEX: $APK"

      - name: Verify XDroid360 DXC runtime dependency is packaged
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)
          test -n "$APK"
          unzip -Z1 "$APK" | grep -Fx 'lib/arm64-v8a/libshaderlib.so'
          unzip -Z1 "$APK" | grep -Fx 'lib/arm64-v8a/libdxcompiler.so'
          unzip -Z1 "$APK" | grep -Fx 'lib/arm64-v8a/libSDL3.so'
          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          unzip -p "$APK" lib/arm64-v8a/libshaderlib.so > /tmp/libshaderlib.so
          unzip -p "$APK" lib/arm64-v8a/libdxcompiler.so > /tmp/libdxcompiler.so
          "$READELF" -d /tmp/libshaderlib.so | grep -F 'Shared library: [libdxcompiler.so]'
          test -s /tmp/libdxcompiler.so
          echo "Verified SDL3, libdxcompiler.so and libshaderlib.so are packaged in the ARM64 APK."

      - name: Upload NGR WinNative ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: NGR-WinNative-arm64-debug
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error
          retention-days: 14
