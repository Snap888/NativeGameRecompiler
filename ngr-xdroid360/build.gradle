plugins {
    alias(libs.plugins.androidLibrary)
}

def ngrRootPath = rootProject.projectDir.absolutePath
def xdroid360DonorDir = new File(ngrRootPath, "native/recompilers/XDroid360")
def defaultPayloadPath = new File(ngrRootPath, "build/xdroid360")
def xdroid360ToolchainDir = providers.gradleProperty("xdroid360.toolchain")
        .map { new File(ngrRootPath, it) }
        .orElse(defaultPayloadPath)
def generatedAssetsDir = layout.buildDirectory.dir("generated/xdroid360/assets")
def generatedJniDir = layout.buildDirectory.dir("generated/xdroid360/jniLibs")

android {
    namespace "com.udarmolota.xdroid360"
    compileSdk 36
    ndkVersion "27.3.13750724"

    defaultConfig {
        minSdk 26
        consumerProguardFiles "consumer-rules.pro"
        buildConfigField "String", "XDROID360_UPSTREAM_REVISION", '"f388d11fc207502cd5975899c8adc06600cfe34f"'
        ndk { abiFilters "arm64-v8a" }
        externalNativeBuild {
            cmake {
                arguments "-DXDROID360_SOURCE_ROOT=${xdroid360DonorDir.absolutePath}",
                          "-DANDROID_STL=c++_static",
                          "-DANDROID_PLATFORM=android-29",
                          "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON",
                          "-DCMAKE_BUILD_TYPE=Release"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    buildFeatures { buildConfig true }

    sourceSets {
        main {
            java.srcDir(rootProject.file("native/recompilers/XDroid360/android/app/src/main/java"))
            res.srcDir(rootProject.file("native/recompilers/XDroid360/android/app/src/main/res"))
            assets.srcDir(rootProject.file("native/recompilers/XDroid360/android/app/src/main/assets"))
            assets.srcDir(generatedAssetsDir)
            jniLibs.srcDir(generatedJniDir)
            manifest.srcFile("src/main/AndroidManifest.xml")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs { useLegacyPackaging = true }
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.coreKtx

    // GameActivity extends WinNative's SDLActivity and uses its SDL surface/thread
    // bridge. XDroid360's duplicate SDL Java sources are excluded centrally, so
    // this explicit project dependency supplies the single canonical Java owner.
    implementation project(":armsx2")
}

tasks.register("prepareXDroid360Payload") {
    inputs.dir(xdroid360ToolchainDir).optional()
    outputs.dir(generatedAssetsDir)
    outputs.dir(generatedJniDir)
    doLast {
        def payload = xdroid360ToolchainDir.get()
        def assetsOut = generatedAssetsDir.get().asFile
        def jniOut = generatedJniDir.get().asFile
        // Use JDK file operations inside the task action; avoid capturing the Gradle script object.
        [assetsOut, jniOut].each { dir ->
            if (dir.exists()) {
                def stream = java.nio.file.Files.walk(dir.toPath())
                try {
                    stream.sorted(java.util.Comparator.reverseOrder()).forEach { java.nio.file.Files.deleteIfExists(it) }
                } finally { stream.close() }
            }
        }
        def kit = new File(payload, "kit.zip")
        def games = new File(payload, "games")
        def libs = new File(payload, "jniLibs/arm64-v8a")
        if (!kit.isFile()) {
            println("XDroid360 toolchain payload absent; packaging UI/runtime shell only. Run the XDroid360 toolchain workflow to enable game builds.")
            return
        }
        def required = ["libclang.so", "liblld.so", "libxenonrecomp.so", "libstfsextract.so", "libshaderlib.so", "libdxcompiler.so"]
        def missing = required.findAll { !new File(libs, it).isFile() }
        if (!missing.isEmpty()) throw new GradleException("XDroid360 payload is incomplete; missing " + missing.join(", "))
        if (!games.isDirectory() || !games.listFiles()?.any { it.name.endsWith(".zip") }) {
            throw new GradleException("XDroid360 payload has no game profile archives in games/")
        }
        java.nio.file.Files.createDirectories(assetsOut.toPath())
        java.nio.file.Files.createDirectories(new File(assetsOut, "games").toPath())
        java.nio.file.Files.createDirectories(new File(jniOut, "arm64-v8a").toPath())
        java.nio.file.Files.copy(kit.toPath(), new File(assetsOut, "kit.zip").toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        games.listFiles().findAll { it.name.endsWith(".zip") }.each { file ->
            java.nio.file.Files.copy(file.toPath(), new File(new File(assetsOut, "games"), file.name).toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
        libs.listFiles().findAll { it.name.endsWith(".so") }.each { file ->
            java.nio.file.Files.copy(file.toPath(), new File(new File(jniOut, "arm64-v8a"), file.name).toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
        println("Prepared XDroid360 kit, " + games.listFiles().count { it.name.endsWith(".zip") } + " profiles and " + required.size() + " ARM64 tools")
    }
}

def xdroid360DonorPath = xdroid360DonorDir.absolutePath
tasks.register("verifyXDroid360SourcePin") {
    doLast {
        def donor = new File(xdroid360DonorPath)
        if (!donor.isDirectory() || !new File(donor, ".git").exists()) {
            throw new GradleException("XDroid360 submodule is missing; run git submodule update --init --recursive")
        }
        def javaRoot = new File(donor, "android/app/src/main/java/com/udarmolota/xdroid360")
        ["BuildService.java", "BuildJob.java", "RecipeRunner.java", "Toolchain.java", "GameSource.java", "Xiso.java"].each {
            if (!new File(javaRoot, it).isFile()) throw new GradleException("XDroid360 source missing: " + it)
        }
        if (!new File(donor, "android/app/src/main/cpp/CMakeLists.txt").isFile()) {
            throw new GradleException("XDroid360 native SDL3/Vulkan build graph is missing")
        }
    }
}

tasks.named("preBuild") {
    dependsOn("verifyXDroid360SourcePin", "prepareXDroid360Payload")
}
